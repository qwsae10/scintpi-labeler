[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scintlab"
version = "0.1.0"
description = "Manual labeling of ScintPi S4 events for a scintillation verification dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyarrow",
    "pyyaml",
    "flask>=3.0",
    "plotly>=5.20",
    "scintkit @ git+https://github.com/qwsae10/scintkit.git",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scintlab = "scintlab.cli:main"

[tool.setuptools.packages.find]
include = ["scintlab*"]

[tool.setuptools.package-data]
scintlab = ["default_config.yaml", "templates/*.html", "static/*"]
